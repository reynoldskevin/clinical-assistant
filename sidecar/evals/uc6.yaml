# UC-6 evals (T19) — stale-active medication (data-quality hedge)
#
# This case asserts the agent answers a "is the patient still taking X?"
# question by actually reading the chart through the boundary (tool_used) AND
# surfaces the stale-active data-quality conflict rather than flatly asserting
# the med is current. A row flagged active whose end_date is already in the past
# is a plausible-but-wrong "currently taking" trap; a grounded answer hedges on
# the staleness. Graded offline against an injected runner, so the graders check
# observable behaviour: whether the boundary tool was used and whether the output
# hedges on staleness.

- name: uc6_stale_active_medication
  question: "Is the patient still taking Warfarin?"
  # The dedicated eval patient (pid 999, seeded by evals/seed_eval_patient.sql)
  # carries a stale-active Warfarin row (active flag set, end_date in the past).
  pid: 999
  # A grounded answer must read the medications through the boundary (tool_used)
  # and hedge on staleness. The first contains_any term ("end date") is the
  # natural staleness phrase the test samples ("its end date suggests it may be
  # stale"); the rest are alternative hedge phrasings.
  guards:
    type: regression
    failure_mode: "A stale 'active' medication (resolved but still flagged active) is presented as currently active without surfacing its status and dates."
  graders:
    - tool_used: true
    - contains_any:
        - "end date"
        - "no longer"
        - "stale"
        - "listed as active"
        - "discontinued"
