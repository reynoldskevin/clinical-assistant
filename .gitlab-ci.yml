# GitLab CI for the AI sidecar eval gate (T26).
#
# Two-tier strategy:
#   * eval:offline — deterministic offline eval tests (no live LLM, no secrets).
#   * eval:live    — scored sweep against the REAL agent+LLM; fails below the
#     pass-rate threshold. Needs the ANTHROPIC_API_KEY CI variable.
#
# A runner is registered, so the per-push blocking gate is ON: eval:offline runs
# on every MR and branch push and must pass to merge. eval:live (the scored LLM
# sweep) stays manual / scheduled / tag and never blocks an MR.
#
# The workflow rules also de-duplicate: a branch push that already has an open MR
# runs only the MR pipeline, not a redundant branch pipeline.

workflow:
  rules:
    # Skip the redundant branch pipeline when the branch already has an open MR.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # Per-push blocking gate: merge requests and branch pushes.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    # Live-sweep triggers (eval:live is manual/allow_failure within these).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$RUN_EVAL_CI'
    - when: never

stages:
  - test
  - security
  - eval

default:
  image: python:3.12-slim

# --- Security tier (T66) -----------------------------------------------------
# Two blocking, secret-free gates that run on every MR and branch push (they
# declare no rules, so they inherit the top-level workflow rules). Tooling is
# pinned in sidecar/requirements-security.txt so the scans are reproducible.

# Dependency audit: fail the pipeline on any known advisory in the sidecar
# dependency tree (declared + resolved transitives). No secret required.
security:deps:
  stage: security
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r sidecar/requirements-security.txt
  script:
    - pip-audit -r sidecar/requirements.txt -r sidecar/requirements-dev.txt

# Static security scan: bandit over the sidecar Python, excluding the
# assert-heavy test tree (B101 noise). -ll reports medium+ severity; accepted
# findings are annotated with scoped `# nosec BXXX` in-source. No secret required.
security:scan:
  stage: security
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r sidecar/requirements-security.txt
  script:
    - bandit -r sidecar -x sidecar/tests -ll

# PHI-detection guard: a blocking, offline, no-secrets gate. Runs the
# deterministic detector over the real Week-2 log/trace emission points and
# fails the build if any direct patient identifier leaks. No live LLM, no
# secrets — mirrors the security:deps / security:scan tier.
security:phi:
  stage: security
  before_script:
    - python -m pip install --upgrade pip
    # Dev deps: pytest (runner) + PyYAML (the guard parses .gitlab-ci.yml).
    - pip install -r sidecar/requirements-dev.txt
  script:
    - python -m pytest -c sidecar/pytest.ini sidecar/tests/test_phi_detection.py

# Deterministic offline eval tests — the per-push BLOCKING gate. Runs on every
# MR and branch push (and in schedule/tag/web pipelines too) and must pass to merge.
eval:offline:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    # Dev deps: pytest (runner) + PyYAML (eval.py loads YAML cases). Pulls in the
    # runtime deps too so any module a test imports is available.
    - pip install -r sidecar/requirements-dev.txt
  script:
    - python -m pytest -c sidecar/pytest.ini sidecar/tests

# Live scored sweep against the real agent+LLM (exit 1 below the pass-rate
# threshold). NON-BLOCKING by design: the sweep is a noisy quality SIGNAL that
# sits below the aspirational 0.9 threshold on a healthy build (small model +
# strict LLM graders + run-to-run variance), so it must never red a healthy
# pipeline. The deterministic offline gate (eval:offline + the real-agent canary)
# is the blocking grading gate. Run this manually / on schedule / on tag to watch
# the live-quality trend; `python -m eval --live --threshold 0.9` exits 1 on a
# below-threshold run for anyone who wants a hard local check.
eval:live:
  stage: eval
  before_script:
    - python -m pip install --upgrade pip
    # Runtime deps (anthropic) + PyYAML for the eval harness.
    - pip install -r sidecar/requirements-dev.txt
  script:
    - cd sidecar
    - python -m eval --live --threshold 0.9
  variables:
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
  rules:
    # Scheduled runs and release tags run it automatically (never blocks).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      allow_failure: true
    - if: '$CI_COMMIT_TAG'
      allow_failure: true
    # On everything else (web / RUN_EVAL_CI) it is manual and never blocks.
    - when: manual
      allow_failure: true
