workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - deploy

railway-deploy:
  stage: deploy
  image: ghcr.io/railwayapp/cli:latest
  variables:
    # This automatically picks up the RAILWAY_TOKEN variable from GitLab Settings
    RAILWAY_TOKEN: $RAILWAY_TOKEN
  script:
    - npm install -g @railway/cli@5.2.0
    - railway up --service=$RAILWAY_SERVICE_ID --detach